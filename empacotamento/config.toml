# Configuração do Streamlit para o pacote Windows (uso local e offline)
[browser]
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "none"
runOnSave = false
# serve static/autosimd_focos.txt, usado pelo iniciar.py para reconhecer o próprio servidor
enableStaticServing = true

[global]
developmentMode = false

[client]
toolbarMode = "viewer"

[logger]
level = "error"
